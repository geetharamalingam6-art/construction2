<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Construction - Contact Us | Get in Touch Today</title>
    <meta name="description" content="Get in touch with Apex Construction's team to discuss your next residential or commercial construction project. Contact us today for inquiries and consultations.">
    <meta name="keywords" content="contact apex construction, construction consultation, hire builder, project inquiry">
    <link rel="canonical" href="https://www.apexconstruction.com/contact.html">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">Apex Construction</div>
            <div class="hamburger" aria-label="Toggle navigation menu" role="button" tabindex="0">&#9776;</div>
            <nav aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html" aria-label="Go to Home page">Home</a></li>
                    <li><a href="about.html" aria-label="Go to About page">About</a></li>
                    <li><a href="services.html" aria-label="Go to Services page">Services</a></li>
                    <li><a href="contact.html" aria-label="Go to Contact page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="contact-content">
            <h1>Contact Us</h1>
            <p>Get in touch with our team to discuss your next construction project.</p>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required aria-label="Full Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required aria-label="Email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required aria-label="Message"></textarea>
                </div>
                <button type="submit" class="submit-btn" aria-label="Submit contact form">Submit</button>
                <div id="formSuccessMessage" style="display: none; color: #27ae60; font-weight: bold; text-align: center; margin-top: 1rem;"></div>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Apex Construction. All rights reserved.</p>
        <p class="footer-contact">Contact: info@apexconstruction.com | Phone: (555) 123-4567 | Follow us on Social Media</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.querySelector('nav ul');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                });
            }

            // Form Optimization & Local Storage Auto-filling Logic
            const contactForm = document.getElementById('contactForm');
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const successMessage = document.getElementById('formSuccessMessage');

            // Load stored data on page load
            const loadStoredData = () => {
                const savedName = localStorage.getItem('fullName');
                const savedEmail = localStorage.getItem('email');
                if (savedName && fullNameInput) {
                    fullNameInput.value = savedName;
                }
                if (savedEmail && emailInput) {
                    emailInput.value = savedEmail;
                }
            };

            // Save data to localStorage on input
            const saveToLocalStorage = () => {
                if (fullNameInput) {
                    localStorage.setItem('fullName', fullNameInput.value);
                }
                if (emailInput) {
                    localStorage.setItem('email', emailInput.value);
                }
            };

            loadStoredData();

            // Attach input event listeners
            if (fullNameInput) {
                fullNameInput.addEventListener('input', saveToLocalStorage);
            }
            if (emailInput) {
                emailInput.addEventListener('input', saveToLocalStorage);
            }

            // Form submission handling
            if (contactForm) {
                contactForm.addEventListener('submit', (event) => {
                    event.preventDefault();
                    if (successMessage) {
                        successMessage.textContent = "Thank you! Your message has been successfully sent.";
                        successMessage.style.display = 'block';
                    }
                    contactForm.reset();
                    localStorage.removeItem('fullName');
                    localStorage.removeItem('email');
                });
            }
        });
    </script>
</body>
</html>
